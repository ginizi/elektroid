title: Digitakt I Sound Bank Generator — Elektroid fork
author:
  name: ginizi
description: Generate tagged Digitakt I sounds from WAV samples, upload directly to sound banks and plan multi-bank transfers with this Elektroid fork.
baseurl: "/elektroid"
url: "https://ginizi.github.io"

# Keep the upstream README source intact, but use the fork landing page online.
exclude:
  - index.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - fork.md

# Build settings
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme

minima:
  skin: auto
  hide_site_feed_link: true
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/ginizi/elektroid"
  nav_pages:
    - license.md
    - installation.md
    - packaging.md
    - cli.md
    - api.md
    - contributing.md

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
